<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ PDF مع تعليقات</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --panel-bg-color: #242424;
            --border-color: #444;
            --input-bg-color: #333;
            --button-color: #4CAF50;
        }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }
        .content-row { display:flex; flex:1; width:100%; }
        .comments-section {
            flex: 0.8; /* Reduced size for comments */
            padding: 1rem;
            background-color: var(--panel-bg-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        #left-comments { border-left: 1px solid var(--border-color); }
        #right-comments { border-right: 1px solid var(--border-color); }
        
        .pdf-viewer-main {
            flex: 5.4; /* Increased size for PDF viewer */
            display: flex;
            flex-direction: column;
            padding: 0 1rem; 
        }
        .pdf-display-area {
            display: flex;
            flex-direction: row; /* Explicitly set to row for LTR ordering of images */
            flex: 1;
            gap: 1rem;
            overflow: auto;
            align-items: flex-start;
        }
        .pdf-page-container {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pdf-page-container img {
            border: 1px solid var(--border-color);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: white;
            filter: invert(100%);
        }
        .top-controls {
            width: 100%;
            padding: 0.1rem 8px; /* slightly larger horizontal padding but controlled */
            text-align: center;
            display: flex;
            flex-direction: row; /* Make it a row */
            justify-content: space-between; /* use full width */
            align-items: center;
            gap: 0.5rem; /* tighter spacing between elements */
            flex-wrap: nowrap; /* keep all controls on single row */
            overflow-x: auto; /* allow horizontal scroll if needed */
            box-sizing: border-box;
        }
        .top-controls label, .top-controls select, .top-controls input, .top-controls button {
            font-size: 0.8rem; /* Even smaller font size for all top controls */
            padding: 3px 8px; /* Consistent padding */
        }
        .top-controls input[type="number"] {
            width: 60px; /* Specific width for number input */
            text-align: center;
        }
        /* Ensure children can shrink so long user-status doesn't force wrapping */
        .top-controls > * { min-width: 0; }
        /* Auth controls layout and truncation for long emails */
        #auth-controls { min-width: 0; display:flex; gap:0.5rem; align-items:center; margin-inline:0.25rem; flex: 0 1 auto; max-width: 420px; }
        #auth-controls form { min-width: 0; display:flex; gap:0.5rem; align-items:center; flex: 0 1 auto; }
        #auth-controls input { min-width: 0; max-width: 140px; padding:4px; }
        .pagination-controls { flex: 0 0 auto; }
        #user-status {
            direction: rtl;
            white-space: nowrap;
            overflow: visible; /* show full status text instead of clipping */
            text-overflow: clip;
            max-width: none; /* allow expansion when space is available */
            display: inline-block;
            min-width: 0;
        }
        /* Style for the clickable label */
        #goto-page-label {
            cursor: pointer;
            text-decoration: none; /* Remove underline */
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 3px 8px; /* Match other buttons */
            border-radius: 5px;
            font-size: 0.8rem; /* Match other buttons */
            line-height: normal; /* Ensure text alignment */
            display: inline-flex; /* Allow padding and alignment */
            align-items: center;
            justify-content: center;
        }
        #goto-page-label:hover {
            opacity: 0.8;
        }
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        .pagination-controls button {
            padding: 3px 8px; /* Smaller buttons */
        }
        #page-num-display {
            font-size: 0.8rem; /* Even smaller font size */
            min-width: 80px; /* Adjust min-width */
            text-align: center;
        }
        .comment-list {
            list-style-type: none;
            padding: 0;
            flex-grow: 1;
        }
        .comment-list li {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            word-wrap: break-word;
            font-size: 0.9rem;
        }
        .comment-form textarea, .comment-form input {
            width: 100%;
            margin-bottom: 0.5rem;
            box-sizing: border-box;
            background-color: var(--input-bg-color);
            color: var(--text-color);
            border: 1px solid #555;
            font-size: 0.9rem;
            padding: 5px;
        }
        button {
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        button:hover { opacity: 0.8; }
    </style>
    <!-- Firebase API key meta (replace with your key or inject at deploy) -->
    <meta name="firebase-api-key" content="REPLACE_WITH_YOUR_FIREBASE_API_KEY">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="top-row">
            <div class="top-controls">
                <label for="pdf-select">اختر ملف PDF:</label>
                <select id="pdf-select">
                    <!-- Options will be populated dynamically by JavaScript -->
                </select>
                <label id="goto-page-label" for="goto-page-input" class="go-to-page-margin">اذهب لصفحة:</label>
                <input type="number" id="goto-page-input" min="1">
                <div class="pagination-controls">
                    <button id="prev-page">‹‹ السابق</button>
                    <span id="page-num-display"></span>
                    <button id="next-page">التالي ››</button>
                </div>
                <div id="auth-controls" style="display:flex;gap:0.5rem;align-items:center;margin-right:1rem;">
                    <form id="auth-form" method="post" action="#" style="display:flex;gap:0.5rem;align-items:center;">
                        <input id="auth-email" autocomplete="username" type="email" placeholder="البريد الإلكتروني" style="padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.05);background:transparent;color:var(--text-color)">
                        <input id="auth-password" autocomplete="current-password" type="password" placeholder="كلمة المرور" style="padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.05);background:transparent;color:var(--text-color)">
                        <button id="auth-signin" type="button">تسجيل دخول</button>
                        <button id="auth-signup" type="button">تسجيل</button>
                    </form>
                    <span id="user-status">غير مسجل</span>
                    <button id="btn-logout" style="display:none">تسجيل خروج</button>
                </div>
            </div>
        </div>

        <div class="content-row">
        <!-- Left Comments Section -->
        <div id="left-comments" class="comments-section">
            <h3 id="left-comments-title">تعليقات الصفحة اليسرى</h3>
            <ul class="comment-list" id="left-comment-list"></ul>
            <form class="comment-form" id="left-comment-form">
                <label for="left-line-number">رقم السطر:</label>
                <input type="number" id="left-line-number" placeholder="ادخل رقم السطر">
                <label for="left-comment-text">التعليق:</label>
                <textarea id="left-comment-text" placeholder="أضف تعليقك..." rows="4"></textarea>
                <button type="submit">إضافة تعليق</button>
            </form>
        </div>

        <!-- Center PDF Viewer Section -->
        <div class="pdf-viewer-main">
            <div class="pdf-display-area">
                <div class="pdf-page-container">
                    <img id="left-pdf-image" alt="PDF page will be loaded here"/>
                </div>
                <div class="pdf-page-container">
                    <img id="right-pdf-image" alt="PDF page will be loaded here"/>
                </div>
            </div>
        </div>

        <!-- Right Comments Section -->
        <div id="right-comments" class="comments-section">
            <h3 id="right-comments-title">تعليقات الصفحة اليمنى</h3>
            <ul class="comment-list" id="right-comment-list"></ul>
            <form class="comment-form" id="right-comment-form">
                <label for="right-line-number">رقم السطر:</label>
                <input type="number" id="right-line-number" placeholder="ادخل رقم السطر">
                <label for="right-comment-text">التعليق:</label>
                <textarea id="right-comment-text" placeholder="أضف تعليقك..." rows="4"></textarea>
                <button type="submit">إضافة تعليق</button>
            </form>
        </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const pdfSelect = document.getElementById('pdf-select');
        const gotoPageInput = document.getElementById('goto-page-input');
        const gotoPageLabel = document.getElementById('goto-page-label');
        const leftPdfImage = document.getElementById('left-pdf-image');
        const rightPdfImage = document.getElementById('right-pdf-image');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const pageNumDisplay = document.getElementById('page-num-display');
        const leftCommentsTitle = document.getElementById('left-comments-title');
        const leftCommentList = document.getElementById('left-comment-list');
        const leftCommentForm = document.getElementById('left-comment-form');
        const rightCommentsTitle = document.getElementById('right-comments-title');
        const rightCommentList = document.getElementById('right-comment-list');
        const rightCommentForm = document.getElementById('right-comment-form');

        // --- State ---
        let state = {
            pdfName: '',
            totalNumPages: 0,
            leftPageNum: 1,
        };
        let pdfPositions = {}; // Object to hold page number for each book, loaded from Firebase
        let appInitialized = false; // ensure initialize() runs once after auth state resolves

        // --- Functions ---
        async function saveState() {
            if (state.pdfName) {
                pdfPositions[state.pdfName] = state.leftPageNum;
            }
            try {
                const token = localStorage.getItem('idToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                await fetch('/api/preferences', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ data: { last_opened_pdf: state.pdfName, pdf_positions: pdfPositions } })
                });
            } catch (error) {
                console.error("Failed to save state:", error);
            }
        }

        function renderPages() {
            const leftNum = state.leftPageNum;
            const rightNum = leftNum + 1;
            // compute target width from container and device pixel ratio
            const leftContainerWidth = leftPdfImage.parentElement.clientWidth || Math.floor(window.innerWidth/2);
            const dpr = window.devicePixelRatio || 1;
            const targetW = Math.round(Math.max(300, Math.min(2500, leftContainerWidth * dpr)));

            function makeUrl(page) {
                return `/api/pdf-page/${state.pdfName}/${page}?w=${targetW}&fmt=webp`;
            }

            if (leftNum > 0 && leftNum <= state.totalNumPages) {
                leftPdfImage.loading = 'eager';
                leftPdfImage.src = makeUrl(leftNum);
                fetchComments('left', leftNum);
            } else {
                leftPdfImage.src = '';
                document.getElementById('left-comment-text').value = '';
                document.getElementById('left-line-number').value = '';
                leftCommentList.innerHTML = '';
                leftCommentsTitle.textContent = '';
            }

            if (rightNum > 0 && rightNum <= state.totalNumPages) {
                rightPdfImage.loading = 'lazy';
                rightPdfImage.src = makeUrl(rightNum);
                fetchComments('right', rightNum);
                // prefetch the next page after the right page
                const nextToPrefetch = rightNum + 1;
                if (nextToPrefetch <= state.totalNumPages) {
                    const p = new Image();
                    p.src = makeUrl(nextToPrefetch);
                }
            } else {
                rightPdfImage.src = '';
                document.getElementById('right-comment-text').value = '';
                document.getElementById('right-line-number').value = '';
                rightCommentList.innerHTML = '';
                rightCommentsTitle.textContent = '';
            }
            
            let displayLeft = leftNum > 0 && leftNum <= state.totalNumPages ? leftNum : '-';
            let displayRight = rightNum > 0 && rightNum <= state.totalNumPages ? rightNum : '-';
            pageNumDisplay.textContent = `صفحة ${displayLeft} - ${displayRight} / ${state.totalNumPages}`;
            // also prefetch previous page (fast back-navigation)
            const prevToPrefetch = leftNum - 1;
            if (prevToPrefetch > 0) {
                const p2 = new Image();
                p2.src = `/api/pdf-page/${state.pdfName}/${prevToPrefetch}?w=${targetW}&fmt=webp`;
            }

            saveState();
        }

        async function loadPdf(pdfName) {
            state.pdfName = pdfName;
            pdfSelect.value = pdfName;

            try {
                const response = await fetch(`/api/pdf-info/${pdfName}`);
                const data = await response.json();
                state.totalNumPages = data.num_pages;
                
                const lastPageForThisPdf = pdfPositions[pdfName] || 1;
                jumpToPage(lastPageForThisPdf);

            } catch (error) {
                console.error("Error loading PDF info:", error);
            }
        }
        
        function jumpToPage(targetPage) {
            targetPage = Math.max(1, Math.min(targetPage, state.totalNumPages));
            let newLeftPageNum = (targetPage % 2 !== 0) ? targetPage : targetPage - 1;
            newLeftPageNum = Math.max(1, newLeftPageNum);
            state.leftPageNum = newLeftPageNum;
            renderPages();
        }

        async function fetchComments(side, pageNum) {
            const commentList = side === 'left' ? leftCommentList : rightCommentList;
            const commentsTitle = side === 'left' ? leftCommentsTitle : rightCommentsTitle;
            
            commentsTitle.textContent = `تعليقات صفحة ${pageNum}`;
            commentList.innerHTML = '<li>تحميل...</li>';
            try {
                const response = await fetch(`/api/comments/${state.pdfName}/${pageNum}`);
                const comments = await response.json();
                commentList.innerHTML = '';
                if (comments.length > 0) {
                    comments.forEach(comment => {
                        const li = document.createElement('li');
                        li.innerHTML = `<strong>سطر: ${comment.line || '-'}</strong><br>${comment.text}`;
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'حذف';
                        deleteBtn.onclick = () => deleteComment(side, pageNum, comment.id);
                        li.prepend(deleteBtn);
                        commentList.appendChild(li);
                    });
                } else {
                    commentList.innerHTML = '<li>لا توجد تعليقات.</li>';
                }
            } catch (error) {
                commentList.innerHTML = '<li>خطأ في تحميل التعليقات.</li>';
            }
        }

        async function postComment(side) {
            const pageNum = side === 'left' ? state.leftPageNum : state.leftPageNum + 1;
            const lineEl = side === 'left' ? document.getElementById('left-line-number') : document.getElementById('right-line-number');
            const textEl = side === 'left' ? document.getElementById('left-comment-text') : document.getElementById('right-comment-text');
            const line = lineEl.value;
            const comment = textEl.value.trim();
            const token = localStorage.getItem('idToken');

            if (comment && pageNum > 0 && pageNum <= state.totalNumPages) {
                try {
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = 'Bearer ' + token;
                    const res = await fetch(`/api/comments/${state.pdfName}/${pageNum}`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ comment, line_number: line })
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(()=>({detail:'Failed'}));
                        console.error('Post comment failed', err);
                        alert(err.detail || err.message || 'فشل في إضافة التعليق');
                        return;
                    }
                    lineEl.value = '';
                    textEl.value = '';
                    fetchComments(side, pageNum);
                } catch (error) { console.error(`Error posting ${side} comment:`, error); alert('خطأ في إضافة التعليق.'); }
            }
        }
        
        async function deleteComment(side, pageNum, commentId) {
            const password = prompt("أدخل كلمة المرور للحذف:");
            if (password === null) return;
            try {
                const token = localStorage.getItem('idToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                const response = await fetch(`/api/comments/${state.pdfName}/${pageNum}/${commentId}`, {
                    method: 'DELETE',
                    headers,
                    body: JSON.stringify({ password })
                });
                const result = await response.json();
                alert(result.message || result.detail);
                if (response.ok) fetchComments(side, pageNum);
            } catch (error) { console.error(`Error deleting ${side} comment:`, error); alert('خطأ في حذف التعليق.'); }
        }

        // --- Firebase Auth Setup (fetch config from server) ---
        (async function setupFirebaseAuth(){
            try {
                const resp = await fetch('/api/firebase-config');
                const cfg = await resp.json().catch(()=>({apiKey: ''}));
                const apiKey = cfg.apiKey || '';
                if (!apiKey) {
                    console.warn('Firebase API key not provided by server; authentication disabled.');
                }

                const firebaseConfig = { apiKey };
                if (typeof firebase !== 'undefined' && firebase.apps && !firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }

                const authForm = document.getElementById('auth-form');
                const authEmail = document.getElementById('auth-email');
                const authPassword = document.getElementById('auth-password');
                const authSignin = document.getElementById('auth-signin');
                const authSignup = document.getElementById('auth-signup');
                const btnLogout = document.getElementById('btn-logout');
                const userStatus = document.getElementById('user-status');

                async function tryStoreCredential(email, password) {
                    try {
                        if (!email || !password) return;
                        if ('credentials' in navigator && window.PasswordCredential) {
                            const cred = new window.PasswordCredential({id: email, password: password});
                            await navigator.credentials.store(cred);
                        }
                    } catch (e) {
                        console.warn('Could not store credential:', e);
                    }
                }

                function updateUIForUser(user) {
                    if (user) {
                        user.getIdToken().then(t => localStorage.setItem('idToken', t));
                        userStatus.textContent = user.email || user.uid;
                        btnLogout.style.display = 'inline-block';
                        if (authForm) authForm.style.display = 'none';
                    } else {
                        localStorage.removeItem('idToken');
                        userStatus.textContent = 'غير مسجل';
                        btnLogout.style.display = 'none';
                        if (authForm) authForm.style.display = 'flex';
                    }
                }

                if (typeof firebase !== 'undefined' && firebase.auth) {
                    firebase.auth().onAuthStateChanged(async user => {
                        updateUIForUser(user);
                        const token = user ? await user.getIdToken() : null;
                        // always reload app state on auth change to reflect per-user prefs
                        await loadAppState(token);
                    });

                    // prevent form submit reload
                    if (authForm) {
                        authForm.addEventListener('submit', (e) => { e.preventDefault(); });
                    }

                    if (authSignin) {
                        authSignin.addEventListener('click', async () => {
                            const email = authEmail.value && authEmail.value.trim();
                            const password = authPassword.value || '';
                            if (!email || !password) { alert('أدخل البريد الإلكتروني وكلمة المرور'); return; }
                            try {
                                const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
                                const token = await cred.user.getIdToken();
                                localStorage.setItem('idToken', token);
                                updateUIForUser(cred.user);
                                await tryStoreCredential(email, password);
                            } catch (e) { console.error('Login failed', e); alert('فشل في تسجيل الدخول'); }
                        });
                    }

                    if (authSignup) {
                        authSignup.addEventListener('click', async () => {
                            const email = authEmail.value && authEmail.value.trim();
                            const password = authPassword.value || '';
                            if (!email || !password) { alert('أدخل البريد الإلكتروني وكلمة المرور'); return; }
                            try {
                                const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
                                const token = await cred.user.getIdToken();
                                localStorage.setItem('idToken', token);
                                updateUIForUser(cred.user);
                                await tryStoreCredential(email, password);
                            } catch (e) { console.error('Signup failed', e); alert('فشل في التسجيل'); }
                        });
                    }

                    btnLogout.addEventListener('click', async () => {
                        try { await firebase.auth().signOut(); updateUIForUser(null); } catch (e) { console.error(e); }
                    });
                } else {
                    console.warn('Firebase SDK not loaded; auth buttons will not function.');
                    if (!appInitialized) {
                        appInitialized = true;
                        // no firebase SDK: load public app state
                        await loadAppState(null);
                    }
                }
            } catch (err) {
                console.error('Auth setup error', err);
            }
        })();

        // --- Event Listeners ---
        prevPageBtn.addEventListener('click', () => {
            if (state.leftPageNum > 1) jumpToPage(state.leftPageNum - 2);
        });
        nextPageBtn.addEventListener('click', () => {
            if (state.leftPageNum + 2 <= state.totalNumPages) jumpToPage(state.leftPageNum + 2);
        });
        
        function handleGoToPage() {
            const targetPage = parseInt(gotoPageInput.value);
            if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= state.totalNumPages) {
                jumpToPage(targetPage);
                gotoPageInput.value = '';
            } else if (!isNaN(targetPage)) {
                 alert(`يرجى إدخال رقم صفحة صالح بين 1 و ${state.totalNumPages}.`);
            }
        }
        gotoPageLabel.addEventListener('click', handleGoToPage);
        gotoPageInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleGoToPage();
        });

        pdfSelect.addEventListener('change', (e) => loadPdf(e.target.value));
        leftCommentForm.addEventListener('submit', (e) => { e.preventDefault(); postComment('left'); });
        rightCommentForm.addEventListener('submit', (e) => { e.preventDefault(); postComment('right'); });

        // --- App State Loader ---
        async function loadAppState(token) {
            try {
                let savedPrefs = { last_opened_pdf: null, pdf_positions: {} };
                if (token) {
                    try {
                        const prefsResponse = await fetch('/api/preferences', { headers: { 'Authorization': 'Bearer ' + token } });
                        if (prefsResponse.ok) {
                            savedPrefs = await prefsResponse.json();
                        } else {
                            console.warn('Could not load preferences (status:', prefsResponse.status, ')');
                        }
                    } catch (e) { console.warn('Failed to fetch preferences:', e); }
                }
                pdfPositions = savedPrefs.pdf_positions || {};

                const pdfsResponse = await fetch('/api/list-pdfs');
                const pdfFiles = await pdfsResponse.json();

                pdfSelect.innerHTML = '';
                pdfFiles.forEach(pdfName => {
                    const option = document.createElement('option');
                    option.value = pdfName;
                    option.textContent = pdfName;
                    pdfSelect.appendChild(option);
                });

                const lastOpenedPdf = savedPrefs.last_opened_pdf || (pdfFiles[0] || null);

                if (lastOpenedPdf) {
                    loadPdf(lastOpenedPdf);
                } else {
                    if (pdfFiles.length === 0) {
                        document.body.innerHTML = "<h1>No PDFs found.</h1>";
                    } else {
                        // default to first PDF without changing saved prefs
                        loadPdf(pdfFiles[0]);
                    }
                }
            } catch (error) {
                console.error("Failed to load app state:", error);
                document.body.innerHTML = "<h1>Failed to initialize application. Check server logs.</h1>";
            }
        }
    </script>
</body>
</html>
