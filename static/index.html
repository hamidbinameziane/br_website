<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ PDF مع تعليقات</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --panel-bg-color: #242424;
            --border-color: #444;
            --input-bg-color: #333;
            --button-color: #4CAF50;
        }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        .comments-section {
            flex: 0.8; /* Reduced size for comments */
            padding: 1rem;
            background-color: var(--panel-bg-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        #left-comments { border-left: 1px solid var(--border-color); }
        #right-comments { border-right: 1px solid var(--border-color); }
        
        .pdf-viewer-main {
            flex: 5.4; /* Increased size for PDF viewer */
            display: flex;
            flex-direction: column;
            padding: 0 1rem; 
        }
        .pdf-display-area {
            display: flex;
            flex-direction: row; /* Explicitly set to row for LTR ordering of images */
            flex: 1;
            gap: 1rem;
            overflow: auto;
            align-items: flex-start;
        }
        .pdf-page-container {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pdf-page-container img {
            border: 1px solid var(--border-color);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: white;
            filter: invert(100%);
        }
        .top-controls {
            padding: 0.2rem 0.5rem; /* Reduced padding */
            text-align: center;
            display: flex;
            flex-direction: row; /* Make it a row */
            justify-content: center;
            align-items: center;
            gap: 1rem; /* Space between elements */
            flex-wrap: wrap;
        }
        .top-controls label, .top-controls select, .top-controls input, .top-controls button {
            font-size: 0.8rem; /* Even smaller font size for all top controls */
            padding: 3px 8px; /* Consistent padding */
        }
        .top-controls input[type="number"] {
            width: 60px; /* Specific width for number input */
            text-align: center;
        }
        /* Style for the clickable label */
        #goto-page-label {
            cursor: pointer;
            text-decoration: none; /* Remove underline */
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 3px 8px; /* Match other buttons */
            border-radius: 5px;
            font-size: 0.8rem; /* Match other buttons */
            line-height: normal; /* Ensure text alignment */
            display: inline-flex; /* Allow padding and alignment */
            align-items: center;
            justify-content: center;
        }
        #goto-page-label:hover {
            opacity: 0.8;
        }
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        .pagination-controls button {
            padding: 3px 8px; /* Smaller buttons */
        }
        #page-num-display {
            font-size: 0.8rem; /* Even smaller font size */
            min-width: 80px; /* Adjust min-width */
            text-align: center;
        }
        .comment-list {
            list-style-type: none;
            padding: 0;
            flex-grow: 1;
        }
        .comment-list li {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            word-wrap: break-word;
            font-size: 0.9rem;
        }
        .comment-form textarea, .comment-form input {
            width: 100%;
            margin-bottom: 0.5rem;
            box-sizing: border-box;
            background-color: var(--input-bg-color);
            color: var(--text-color);
            border: 1px solid #555;
            font-size: 0.9rem;
            padding: 5px;
        }
        button {
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left Comments Section -->
        <div id="left-comments" class="comments-section">
            <h3 id="left-comments-title">تعليقات الصفحة اليسرى</h3>
            <ul class="comment-list" id="left-comment-list"></ul>
            <form class="comment-form" id="left-comment-form">
                <label for="left-line-number">رقم السطر:</label>
                <input type="number" id="left-line-number" placeholder="ادخل رقم السطر">
                <label for="left-comment-text">التعليق:</label>
                <textarea id="left-comment-text" placeholder="أضف تعليقك..." rows="4"></textarea>
                <button type="submit">إضافة تعليق</button>
            </form>
        </div>

        <!-- Center PDF Viewer Section -->
        <div class="pdf-viewer-main">
            <div class="top-controls">
                <label for="pdf-select">اختر ملف PDF:</label>
                <select id="pdf-select">
                    <!-- Options will be populated dynamically by JavaScript -->
                </select>
                <label id="goto-page-label" for="goto-page-input" style="margin-left: 1rem;">اذهب لصفحة:</label>
                <input type="number" id="goto-page-input" min="1">
                <div class="pagination-controls" style="margin-left: 1rem;">
                    <button id="prev-page">‹‹ السابق</button>
                    <span id="page-num-display"></span>
                    <button id="next-page">التالي ››</button>
                </div>
            </div>
            <div class="pdf-display-area">
                <div class="pdf-page-container">
                    <img id="left-pdf-image" alt="PDF page will be loaded here"/>
                </div>
                <div class="pdf-page-container">
                    <img id="right-pdf-image" alt="PDF page will be loaded here"/>
                </div>
            </div>
        </div>

        <!-- Right Comments Section -->
        <div id="right-comments" class="comments-section">
            <h3 id="right-comments-title">تعليقات الصفحة اليمنى</h3>
            <ul class="comment-list" id="right-comment-list"></ul>
            <form class="comment-form" id="right-comment-form">
                <label for="right-line-number">رقم السطر:</label>
                <input type="number" id="right-line-number" placeholder="ادخل رقم السطر">
                <label for="right-comment-text">التعليق:</label>
                <textarea id="right-comment-text" placeholder="أضف تعليقك..." rows="4"></textarea>
                <button type="submit">إضافة تعليق</button>
            </form>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const pdfSelect = document.getElementById('pdf-select');
        const gotoPageInput = document.getElementById('goto-page-input');
        const gotoPageLabel = document.getElementById('goto-page-label');
        const leftPdfImage = document.getElementById('left-pdf-image');
        const rightPdfImage = document.getElementById('right-pdf-image');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const pageNumDisplay = document.getElementById('page-num-display');
        const leftCommentsTitle = document.getElementById('left-comments-title');
        const leftCommentList = document.getElementById('left-comment-list');
        const leftCommentForm = document.getElementById('left-comment-form');
        const rightCommentsTitle = document.getElementById('right-comments-title');
        const rightCommentList = document.getElementById('right-comment-list');
        const rightCommentForm = document.getElementById('right-comment-form');

        // --- State ---
        let state = {
            pdfName: '',
            totalNumPages: 0,
            leftPageNum: 1,
        };
        let pdfPositions = {}; // Object to hold page number for each book, loaded from Firebase

        // --- Functions ---
        async function saveState() {
            if (state.pdfName) {
                pdfPositions[state.pdfName] = state.leftPageNum;
            }
            try {
                await fetch('/api/preferences', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        last_opened_pdf: state.pdfName,
                        pdf_positions: pdfPositions
                    })
                });
            } catch (error) {
                console.error("Failed to save state:", error);
            }
        }

        function renderPages() {
            const leftNum = state.leftPageNum;
            const rightNum = leftNum + 1;

            if (leftNum > 0 && leftNum <= state.totalNumPages) {
                leftPdfImage.src = `/api/pdf-page/${state.pdfName}/${leftNum}`;
                fetchComments('left', leftNum);
            } else {
                leftPdfImage.src = '';
                document.getElementById('left-comment-text').value = '';
                document.getElementById('left-line-number').value = '';
                leftCommentList.innerHTML = '';
                leftCommentsTitle.textContent = '';
            }

            if (rightNum > 0 && rightNum <= state.totalNumPages) {
                rightPdfImage.src = `/api/pdf-page/${state.pdfName}/${rightNum}`;
                fetchComments('right', rightNum);
            } else {
                rightPdfImage.src = '';
                document.getElementById('right-comment-text').value = '';
                document.getElementById('right-line-number').value = '';
                rightCommentList.innerHTML = '';
                rightCommentsTitle.textContent = '';
            }
            
            let displayLeft = leftNum > 0 && leftNum <= state.totalNumPages ? leftNum : '-';
            let displayRight = rightNum > 0 && rightNum <= state.totalNumPages ? rightNum : '-';
            pageNumDisplay.textContent = `صفحة ${displayLeft} - ${displayRight} / ${state.totalNumPages}`;
            saveState();
        }

        async function loadPdf(pdfName) {
            state.pdfName = pdfName;
            pdfSelect.value = pdfName;

            try {
                const response = await fetch(`/api/pdf-info/${pdfName}`);
                const data = await response.json();
                state.totalNumPages = data.num_pages;
                
                const lastPageForThisPdf = pdfPositions[pdfName] || 1;
                jumpToPage(lastPageForThisPdf);

            } catch (error) {
                console.error("Error loading PDF info:", error);
            }
        }
        
        function jumpToPage(targetPage) {
            targetPage = Math.max(1, Math.min(targetPage, state.totalNumPages));
            let newLeftPageNum = (targetPage % 2 !== 0) ? targetPage : targetPage - 1;
            newLeftPageNum = Math.max(1, newLeftPageNum);
            state.leftPageNum = newLeftPageNum;
            renderPages();
        }

        async function fetchComments(side, pageNum) {
            const commentList = side === 'left' ? leftCommentList : rightCommentList;
            const commentsTitle = side === 'left' ? leftCommentsTitle : rightCommentsTitle;
            
            commentsTitle.textContent = `تعليقات صفحة ${pageNum}`;
            commentList.innerHTML = '<li>تحميل...</li>';
            try {
                const response = await fetch(`/api/comments/${state.pdfName}/${pageNum}`);
                const comments = await response.json();
                commentList.innerHTML = '';
                if (comments.length > 0) {
                    comments.forEach(comment => {
                        const li = document.createElement('li');
                        li.innerHTML = `<strong>سطر: ${comment.line || '-'}</strong><br>${comment.text}`;
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'حذف';
                        deleteBtn.onclick = () => deleteComment(side, pageNum, comment.id);
                        li.prepend(deleteBtn);
                        commentList.appendChild(li);
                    });
                } else {
                    commentList.innerHTML = '<li>لا توجد تعليقات.</li>';
                }
            } catch (error) {
                commentList.innerHTML = '<li>خطأ في تحميل التعليقات.</li>';
            }
        }

        async function postComment(side) {
            const pageNum = side === 'left' ? state.leftPageNum : state.leftPageNum + 1;
            const lineEl = side === 'left' ? document.getElementById('left-line-number') : document.getElementById('right-line-number');
            const textEl = side === 'left' ? document.getElementById('left-comment-text') : document.getElementById('right-comment-text');
            const line = lineEl.value;
            const comment = textEl.value.trim();

            if (comment && pageNum > 0 && pageNum <= state.totalNumPages) {
                try {
                    await fetch(`/api/comments/${state.pdfName}/${pageNum}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comment, line_number: line })
                    });
                    lineEl.value = '';
                    textEl.value = '';
                    fetchComments(side, pageNum);
                } catch (error) { console.error(`Error posting ${side} comment:`, error); }
            }
        }
        
        async function deleteComment(side, pageNum, commentId) {
            const password = prompt("أدخل كلمة المرور للحذف:");
            if (password === null) return;
            try {
                const response = await fetch(`/api/comments/${state.pdfName}/${pageNum}/${commentId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await response.json();
                alert(result.message || result.detail);
                if (response.ok) fetchComments(side, pageNum);
            } catch (error) { console.error(`Error deleting ${side} comment:`, error); }
        }

        // --- Event Listeners ---
        prevPageBtn.addEventListener('click', () => {
            if (state.leftPageNum > 1) jumpToPage(state.leftPageNum - 2);
        });
        nextPageBtn.addEventListener('click', () => {
            if (state.leftPageNum + 2 <= state.totalNumPages) jumpToPage(state.leftPageNum + 2);
        });
        
        function handleGoToPage() {
            const targetPage = parseInt(gotoPageInput.value);
            if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= state.totalNumPages) {
                jumpToPage(targetPage);
                gotoPageInput.value = '';
            } else if (!isNaN(targetPage)) {
                 alert(`يرجى إدخال رقم صفحة صالح بين 1 و ${state.totalNumPages}.`);
            }
        }
        gotoPageLabel.addEventListener('click', handleGoToPage);
        gotoPageInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleGoToPage();
        });

        pdfSelect.addEventListener('change', (e) => loadPdf(e.target.value));
        leftCommentForm.addEventListener('submit', (e) => { e.preventDefault(); postComment('left'); });
        rightCommentForm.addEventListener('submit', (e) => { e.preventDefault(); postComment('right'); });

        // --- Initial Load ---
        async function initialize() {
            try {
                const prefsResponse = await fetch('/api/preferences');
                const savedPrefs = await prefsResponse.json();
                pdfPositions = savedPrefs.pdf_positions || {};
                
                const pdfsResponse = await fetch('/api/list-pdfs');
                const pdfFiles = await pdfsResponse.json();

                pdfSelect.innerHTML = '';
                pdfFiles.forEach(pdfName => {
                    const option = document.createElement('option');
                    option.value = pdfName;
                    option.textContent = pdfName;
                    pdfSelect.appendChild(option);
                });
                
                const lastOpenedPdf = savedPrefs.last_opened_pdf || (pdfFiles[0] || null);
                
                if (lastOpenedPdf) {
                    // Use the per-book position if available, otherwise default to 1
                    const lastPageForThisPdf = pdfPositions[lastOpenedPdf] || 1;
                    loadPdf(lastOpenedPdf, lastPageForThisPdf);
                } else {
                    document.body.innerHTML = "<h1>No PDFs found.</h1>";
                }

            } catch (error) {
                console.error("Failed to initialize application:", error);
                document.body.innerHTML = "<h1>Failed to initialize application. Check server logs.</h1>";
            }
        }

        initialize();
    </script>
</body>
</html>
